[project]
name = "whatsapp-mcp-macos"
version = "0.1.0"
description = "MCP server for your own WhatsApp on macOS: reads the desktop app's local database, sends through the official app. No unofficial protocol client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2,<3"]

[project.scripts]
whatsapp-mcp-macos = "whatsapp_mcp_macos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_mcp_macos"]
